services:
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      APP_ENV: local
      APP_SECRET: ${APP_SECRET:-local-dev-secret}
      DATABASE_URL: mysql+pymysql://${MARIADB_USER:-thrivematrix}:${MARIADB_PASSWORD:-thrivematrix}@mariadb:3306/${MARIADB_DATABASE:-thrivematrix}
      REDIS_URL: redis://redis:6379/0
      MARIADB_DATABASE: ${MARIADB_DATABASE:-thrivematrix}
      MARIADB_USER: ${MARIADB_USER:-thrivematrix}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-thrivematrix}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-thrive-matrix}
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-localadmin}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-localadmin}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
    restart: on-failure
    pull_policy: missing
  mariadb:
    profiles: ["core"]
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-thrivematrix}
      MARIADB_USER: ${MARIADB_USER:-thrivematrix}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-thrivematrix}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD} --silent",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: on-failure
  redis:
    profiles: ["core"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 10
    restart: on-failure
  object-storage:
    profiles: ["storage"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 8
    restart: on-failure

volumes:
  mariadb-data:
  object-storage-data:
